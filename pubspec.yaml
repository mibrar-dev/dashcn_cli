name: dashcn_cli
description: >-
  CLI to install, sync, and update dashcn components in Flutter apps.
  Supports local and remote registries with dependency-aware installs.
version: 0.1.0
repository: https://github.com/mibrar-dev/dashcn_cli
homepage: https://github.com/mibrar-dev/dashcn_cli

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  analyzer: ^14.0.0
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.3
  http: ^1.6.0
  json_schema: ^5.2.2
  crypto: ^3.0.6

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.5

executables:
  dashcn: dashcn
